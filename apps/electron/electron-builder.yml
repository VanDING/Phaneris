# Product identity (appId, productName, copyright, artifactName) is NOT declared
# here on purpose. It lives only in phaneris.identity.json at the repository root
# and is rendered into ./identity.generated.yml by `bun run identity:generate`,
# so the packaging config, the runtime and the build scripts cannot drift apart.
# `bun run identity:check` fails whenever these keys reappear in this file.
extends: ./identity.generated.yml

# The Electron runtime baked into the installer. electron-builder reads this
# literal rather than the `electron` range in package.json, so it must be bumped
# by hand whenever that dependency moves — scripts/check-electron-pin.ts fails
# otherwise, because a stale pin silently ships the previous runtime.
electronVersion: "44.5.1"

# Native addons ship as prebuilt N-API binaries via extraResources — node-pty's
# prebuilds/<platform>-<arch>/*.node below, whose node-gyp build/** output is
# excluded on purpose. @electron/rebuild only recompiles that never-shipped
# output, and dies with MSB8040 (missing VS "Spectre-mitigated libs") when the
# component is absent, so packaging must not rebuild native modules.
npmRebuild: false

# Fetch pinned runtimes and compile the Windows NSIS skin before copying resources.
# beforeBuild is skipped with npmRebuild: false, so both run in beforePack.
beforePack: scripts/beforePack.cjs

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  # Include Pi agent server subprocess for Pi SDK sessions
  - resources/pi-agent-server/**/*
  # The subprocess ships once via extraResources below. Excluding both staged
  # copies avoids a third 22 MB bundle inside resources/app.
  - "!dist/resources/pi-agent-server/**"
  - "!resources/pi-agent-server/**"
  # Note: Bundled assets (docs, themes, permissions, tool-icons) are in resources/
  # and copied to dist/resources/ by build:copy. They're included via dist/**/* above.
  # Include network interceptor for API error capture and MCP schema injection
  - packages/shared/src/unified-network-interceptor.ts
  - packages/shared/src/interceptor-common.ts
  - packages/shared/src/feature-flags.ts
  - packages/shared/src/interceptor-request-utils.ts
  # CLI tools (wrappers, python scripts, platform uv binary) ship via
  # extraResources below — they must live OUTSIDE app.asar because child
  # processes (cmd/bash/uv) cannot execute files inside asar.
  # Include bundled Bun runtime (platform-specific, set by build script)
  - vendor/bun/**/*
  # Exclude everything from node_modules (will use extraResources for SDK)
  - "!node_modules/**/*"

# Disable ASAR to avoid decompression overhead and click delays (matches
# upstream). Regression note: this line was dropped during the 2026-07 Pi SDK
# migration, silently re-enabling asar and trapping resources/bin +
# resources/scripts inside app.asar — CLI document tools became unexecutable
# in packaged builds. bin/scripts also ship via extraResources below as a
# second line of defense.
asar: false


# Windows installer: a fully owner-drawn 600x600 surface, not NSIS's stock
# dialog. `oneClick: false` is required to have pages at all, but the product
# decision is still one click to the default per-user location — the install
# mode page is suppressed in scripts/installer.nsh (`customInstallMode` forces
# current-user, which makes its PRE function Abort), `allowToChangeInstallationDirectory`
# stays false so there is no directory page. The branded welcome page offers
# Install now and Choose location, followed by progress and a branded finish
# page with an optional app-launch checkbox.
#
# `allowElevation: false` + `perMachine: false` keep this a per-user install
# that never raises a UAC prompt — which is also why the reference installer can
# draw its own window: there is no elevation hand-off mid-flow.
#
# `installerLanguages` is pinned to two on purpose. The stock build compiles 25
# MUI languages in; trimming to the two we actually ship strings for cuts the
# installer's string table and makes a missing LangString a loud compile error
# instead of a silent `$(TOKEN)` in the UI. scripts/installer.nsh's strings.nsh
# must cover exactly this set.
#
# NOTE: no `artifactName` here on purpose — identity keys live only in
# identity.generated.yml, and `identity:check` fails if they reappear.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  installerLanguages:
    - en_US
    - zh_CN
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeader: installer/assets/installerHeader.bmp
  installerSidebar: installer/assets/uninstaller-sidebar.bmp
  uninstallerSidebar: installer/assets/uninstaller-sidebar.bmp
  include: scripts/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Phaneris
  # electron-updater's differential download needs the blockmap; dropping this
  # silently turns every update into a full 170 MB re-download.
  differentialPackage: true

extraResources:
  # Native PTY runtime for the local integrated terminal. Hoisted to the
  # workspace root by bun, so the source is repo-root-relative.
  - from: ../../node_modules/node-pty
    to: app/node_modules/node-pty
    filter:
      - "**/*"
      - "!**/*.pdb"
      - "!**/*.iobj"
      - "!**/*.obj"
      - "!**/*.lib"
      - "!**/*.exp"
      - "!build/**"
  # Pi agent server subprocess (Pi SDK sessions)
  - from: dist/resources/pi-agent-server
    to: pi-agent-server
  # ripgrep (used by search service)
  - from: node_modules/@vscode/ripgrep
    to: app/node_modules/@vscode/ripgrep
  # ripgrep platform package: @vscode/ripgrep >= 1.15 resolves the binary via
  # its optionalDependency @vscode/ripgrep-<platform>-<arch> (lib/index.js), so
  # the platform package must ship next to it.
  - from: node_modules/@vscode/ripgrep-darwin-${arch}
    to: app/node_modules/@vscode/ripgrep-darwin-${arch}
  # Windows optional package. The wrapper above contains no binary and resolves
  # rg.exe from this sibling package at runtime.
  - from: node_modules/@vscode/ripgrep-win32-${arch}
    to: app/node_modules/@vscode/ripgrep-win32-${arch}
  - from: node_modules/@vscode/ripgrep-linux-${arch}
    to: app/node_modules/@vscode/ripgrep-linux-${arch}
  # WhatsApp worker subprocess (self-contained; Baileys bundled in).
  # Runtime resolves it at <resourcesPath>/messaging-whatsapp-worker/worker.cjs
  # (apps/electron/src/main/index.ts), so stage it flat under Resources — the
  # old `to: app/packages/...` placement never matched that path and every
  # packaged WhatsApp connect died with MODULE_NOT_FOUND.
  # NB: extraResources `from` is relative to the project dir (apps/electron),
  # so the worker package at the repo root needs the ../.. prefix.
  - from: ../../packages/messaging-whatsapp-worker/dist
    to: messaging-whatsapp-worker
    filter:
      - "**/*"
  # CLI document tools: wrappers (pdf-tool, xlsx-tool, …) + .cmd launchers +
  # python scripts + platform uv binary. Staged under <resources>/app so the
  # main-process resourcesBase (process.resourcesPath/app) resolves binDir,
  # scriptsDir and the uv binary to real disk paths — asar-virtual paths are
  # invisible to spawned cmd/bash/uv processes (ENOENT / not recognized).
  - from: resources/bin
    to: app/resources/bin
    filter:
      - "**/*"
  - from: resources/scripts
    to: app/resources/scripts
    filter:
      - "**/*"
  # Bun runtime
  - from: vendor/bun
    to: app/vendor/bun
    filter:
      - "**/*"
