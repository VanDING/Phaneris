# GENERATED FILE — DO NOT EDIT BY HAND.
#
# Source of truth: phaneris.identity.json (repository root)
# Regenerate:      bun run identity:generate
# Verify:          bun run identity:check
#
# Pulled in by apps/electron/electron-builder.yml via `extends`. The identity
# keys live ONLY here, so electron-builder's merge order can never change the
# packaged application identity.
#
# `packaging.companyName` is deliberately ABSENT: electron-builder has no
# companyName option. Its AppInfo.companyName — the value written as the
# Windows VERSIONINFO CompanyName, the NSIS COMPANY_NAME and the MSI
# manufacturer — is read straight from the nearest package.json `author.name`.
# The packaged CompanyName is therefore controlled in apps/electron/package.json;
# `scripts/check-identity.ts` fails if that author drifts from
# packaging.companyName.

appId: 'io.github.vanding.phaneris'
productName: 'Phaneris'
copyright: 'Copyright © 2026 VanDING. Based on Craft Agents, Copyright © 2026 Craft Docs Ltd.'
artifactName: 'Phaneris-${version}-${os}-${arch}.${ext}'

# Deep-link scheme, declared IN THE BUNDLE so the OS can route it here.
#
# This is REQUIRED on macOS: LaunchServices only lets an app become the default
# handler for a scheme it declares via CFBundleURLTypes, so without this block
# `app.setAsDefaultProtocolClient(DEEPLINK_SCHEME)` cannot take effect and every
# `phaneris://` link is dropped — including the OAuth return deeplink
# back into a session. The scheme is rendered from the identity here rather than
# written into electron-builder.yml, which is forbidden from restating identity.
#
# On Windows electron-builder writes the matching registry entries at install
# time, so this one declaration covers both platforms.
protocols:
  - name: 'Phaneris'
    schemes:
      - 'phaneris'
